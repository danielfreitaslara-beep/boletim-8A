<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <!-- ÁREA DE ACESSO POR PIN -->
  <section class="acesso" id="acesso">
    <p class="acesso-info" id="acesso-info">8º Ano — Turma 8A — Nº 35</p>
    <div class="acesso-campos">
      <input
        type="password"
        id="campo-pin"
        class="campo-pin"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Digite seu PIN"
        aria-label="PIN"
      />
      <button type="button" id="botao-entrar" class="botao">Entrar</button>
    </div>
    <p class="acesso-status" id="acesso-status"></p>
  </section>

  <!-- ÁREA DO BOLETIM (oculta até o login) -->
  <main id="area-boletim" class="area-boletim oculto">

    <!-- CARDS DE RESUMO (preenchidos pelo JavaScript) -->
    <section class="cards" id="cards"></section>

    <!-- ÁREA DOS GRÁFICOS (preenchida pelo Chart.js) -->
    <section class="area-graficos" id="area-graficos">

      <article class="grafico-card">
        <h2 class="grafico-titulo">Média por disciplina</h2>
        <div class="grafico-container grafico-container-medios">
          <canvas id="graficoMediasDisciplinas" aria-label="Gráfico de média por disciplina"></canvas>
        </div>
      </article>

      <article class="grafico-card">
        <h2 class="grafico-titulo">Evolução da média geral</h2>
        <div class="grafico-container">
          <canvas id="graficoEvolucaoTrimestres" aria-label="Gráfico de evolução da média geral por trimestre"></canvas>
        </div>
      </article>

      <article class="grafico-card" id="cardFaltas">
        <div class="grafico-cabecalho">
          <h2 class="grafico-titulo">Faltas por trimestre</h2>
          <span class="badge-perigo oculto" id="estadoFaltas">Perigo</span>
        </div>
        <div class="grafico-container">
          <canvas id="graficoFaltasTrimestres" aria-label="Gráfico de faltas por trimestre"></canvas>
        </div>
      </article>

    </section>

    <!-- TABELA DE DISCIPLINAS (preenchida pelo JavaScript) -->
    <section class="tabela-container">
      <table class="tabela">
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </section>

    <!-- AÇÕES DE EDIÇÃO E SALVAMENTO -->
    <section class="acoes-edicao" id="acoes-edicao">
      <button type="button" id="botao-alterar" class="botao botao-secundario">Alterar dados</button>
      <button type="button" id="botao-salvar" class="botao botao-primario oculto">Salvar alterações</button>
      <p class="edicao-status" id="edicao-status"></p>
    </section>

  </main>

  <!-- Chart.js (deve vir ANTES do script.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Liga o arquivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
