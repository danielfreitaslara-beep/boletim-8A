<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site funcione bem no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <!-- Liga o arquivo de estilo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <!-- CARDS DE RESUMO (preenchidos pelo JavaScript) -->
  <section class="cards" id="cards"></section>

  <!-- TABELA DE DISCIPLINAS (preenchida pelo JavaScript) -->
  <section class="tabela-container">
    <table class="tabela">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <!-- O corpo da tabela é preenchido pelo script.js -->
      <tbody id="corpo-tabela"></tbody>
    </table>
  </section>

  <!-- Liga o arquivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
